<!-- Component handbook host — open with ?c=Button (or any component name).
     Use the extensionless URL (docs/component?c=Button): static servers that
     strip .html also drop the query string on redirect. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Component · Shantara design system</title>
  <link rel="icon" href="../assets/icon-olive.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="doc.css">
  <style>
    .ds-specimen-frame{
      width:100%;
      min-height:280px;
      height:320px;
      border:1px solid var(--border-subtle);
      border-radius:var(--radius-card);
      background:var(--surface-page);
      margin:0 0 var(--space-8);
    }
    .ds-component-families{
      display:flex;
      flex-wrap:wrap;
      gap:var(--space-2);
      margin:0 0 var(--space-6);
    }
    .ds-component-families a{
      font-size:var(--text-xs);
      color:var(--text-secondary);
      text-decoration:none;
      padding:6px 10px;
      border-radius:var(--radius-sm);
      border:1px solid var(--border-subtle);
    }
    .ds-component-families a[aria-current="page"]{
      color:var(--text-primary);
      border-color:var(--border-control);
      background:var(--surface-raised);
    }
    .ds-component-siblings{
      display:flex;
      flex-wrap:wrap;
      gap:8px 14px;
      margin:0 0 var(--space-7);
      padding:0;
      list-style:none;
    }
    .ds-component-siblings a{
      font-size:var(--text-sm);
      color:var(--text-secondary);
      text-decoration:none;
    }
    .ds-component-siblings a[aria-current="page"]{
      color:var(--text-primary);
      text-decoration:underline;
      text-underline-offset:4px;
    }
  </style>
</head>
<body class="ds-doc ds-handbook">
  <a class="ds-skip" href="#component">Skip to content</a>
  <header class="ds-handbook-mast">
    <div class="ds-handbook-mast-inner">
      <p class="shantara-eyebrow" data-component-family>Components</p>
      <h1 data-component-title>Component</h1>
      <p class="ds-handbook-lead" data-component-lead>Prompt and live specimen for one design-system control.</p>
      <p class="ds-handbook-meta">
        <span data-component-path></span>
        <span>Family overview stays on the family card</span>
      </p>
    </div>
  </header>
  <div class="ds-handbook-shell">
    <nav class="ds-handbook-toc" aria-label="Component sections" data-toc></nav>
    <div class="ds-doc-inner" id="component">
      <nav class="ds-component-families" aria-label="Component families" data-family-nav></nav>
      <ul class="ds-component-siblings" aria-label="Components in this family" data-sibling-nav></ul>
      <iframe class="ds-specimen-frame" title="Live specimen" data-specimen src="about:blank"></iframe>
      <article data-component-md></article>
    </div>
  </div>
  <script src="doc.js"></script>
</body>
</html>
