<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shantara design system</title>
  <meta name="description" content="Notes, colour, type, logo, pattern, components and the two UI kits for Shantara Naturopathy Retreat.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F0E6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2D2926">
  <link rel="icon" href="assets/icon-olive.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="catalog.css">
</head>
<body class="catalog" data-view="home">
  <a class="ds-skip" href="#dsp-main">Skip to content</a>

  <section class="home" data-panel="home">
    <div class="hero shantara-pattern" data-tone="dark">
      <span class="shantara-pattern-band" data-edge="right" aria-hidden="true"></span>
      <div class="hero-copy">
        <div class="hero-inner">
          <h1>Design system</h1>
          <p class="hero-lead">Notes, colour, type, logo, pattern, components and the two UI kits. Browse it here, or copy this folder into another repo as the design system.</p>
          <p class="hero-meta" data-home-meta></p>
        </div>
      </div>
    </div>
    <div class="catalog-list" data-catalog></div>
    <p class="empty" data-empty hidden>Nothing matches that search.</p>
  </section>

  <section class="viewer" data-panel="viewer" hidden>
    <header class="ds-page-head viewer-head">
      <div class="ds-page-head-inner">
        <div class="viewer-title-row">
          <h1 data-view-name></h1>
          <div class="viewer-actions">
            <div class="dir-toggle" role="group" aria-label="Reading direction" hidden>
              <button type="button" data-dir="ltr" aria-pressed="true">LTR</button>
              <button type="button" data-dir="rtl" aria-pressed="false">RTL</button>
            </div>
            <a class="btn btn-ghost" data-view-open href="#" target="_blank" rel="noopener">Open full page</a>
          </div>
        </div>
        <p class="ds-page-lead" data-view-sub></p>
        <p class="ds-handbook-meta" data-view-meta></p>
      </div>
    </header>
    <div class="viewer-body">
      <div data-view-toolbar></div>
      <iframe class="frame" data-frame title="Selected card" allow="clipboard-write"></iframe>
    </div>
  </section>

  <script src="portal.js" data-mode="catalog"></script>
  <script src="catalog.js"></script>
</body>
</html>
