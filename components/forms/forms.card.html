<!-- @dsCard group="Components" viewport="760x1480" name="Forms" subtitle="Input, textarea, select, checkbox, radio, switch" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../i18n.js"></script>
<style>body{padding:20px;background:var(--surface-page)}.form{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-7) var(--space-6);max-width:720px;padding:clamp(20px,4vw,40px);background:var(--surface-card);border-radius:var(--radius-card)}.form>.full{grid-column:1 / -1}.form .sh-ctl{background:var(--surface-page)}.group{display:flex;flex-direction:column;gap:0;border:0;margin:0;padding:0;min-width:0}.group legend{padding:0;margin-bottom:var(--space-2);font:var(--weight-medium) var(--text-sm)/1.3 var(--font-body);color:var(--text-primary)}.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-6);max-width:720px;margin-top:var(--space-8)}.stack{display:flex;flex-direction:column;gap:var(--space-5);min-width:0}.cap{margin:0 0 var(--space-3);font:var(--type-caption);color:var(--text-muted)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);max-width:720px;margin-top:var(--space-8)}h2.t{font:var(--type-h4);margin:0 0 var(--space-2)}.sub{margin:0 0 var(--space-7);color:var(--text-secondary);font:var(--type-body-sm)}@media (max-width:640px){.form,.states,.pair{grid-template-columns:1fr}}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Select, Checkbox, Radio, Switch, Button, Icon } = window.ShantaraDesignSystem_45bbe4;
const PROGRAMMES=["Stress Management","Detox","Weight Management","Diabetes Reversal","Longevity","Complete Healing"];
const COUNTRIES=["India","United Arab Emirates","Saudi Arabia","United Kingdom","Germany","Other"];
function Demo(){
  const {ar}=window.ShantaraI18n.useLocale();
  const [note,setNote]=React.useState("Type 2 diabetes for eight years; on metformin.");
  const [contact,setContact]=React.useState("whatsapp");
  return (<div>
<form className="form" onSubmit={e=>e.preventDefault()} noValidate>
<div className="full"><h2 className="t">Book a Consultation</h2><p className="sub">Tell us a little about yourself. A member of our team will call you back.</p></div>
<Input label="Full name" required autoComplete="name" placeholder="As on your passport"/>
<Input label="Email" type="email" required defaultValue="anya.raman@" error="Enter an email address like name@example.com."/>
<Input label="Phone or WhatsApp" type="tel" required autoComplete="tel" startIcon={<Icon name="phone" size={16}/>} placeholder="+91 98765 43210" hint="Include your country code."/>
<Select label="Country of residence" required placeholder="Choose a country" options={COUNTRIES}/>
<Select label="Programme of interest" optional placeholder="Not sure yet" options={PROGRAMMES}/>
<Input label="Preferred arrival" type="date" optional/>
<Textarea className="full" label="Health concerns" hint="Conditions, medication and anything your doctor should know." maxLength={400} value={note} onChange={e=>setNote(e.target.value)}/>
<fieldset className="group full" role="radiogroup">
<legend>How should we contact you?</legend>
<div style={{display:"flex",flexWrap:"wrap",columnGap:"var(--space-7)"}}>
<Radio name="contact" value="call" label="Phone call" checked={contact==="call"} onChange={()=>setContact("call")}/>
<Radio name="contact" value="whatsapp" label="WhatsApp" checked={contact==="whatsapp"} onChange={()=>setContact("whatsapp")}/>
<Radio name="contact" value="email" label="Email" checked={contact==="email"} onChange={()=>setContact("email")}/>
</div>
</fieldset>
<div className="full stack" style={{gap:0}}>
<Checkbox label="I have medical reports from the last 12 months" description="You can share them with our team after we call." defaultChecked/>
<Checkbox label="I agree to be contacted about my consultation" required error="Please tick this box so our team can contact you."/>
</div>
<div className="full"><Button type="submit" size="lg">Send your details</Button></div>
</form>
<div className="states">
<div className="stack"><p className="cap">Text fields</p>
<Input label="Default" placeholder="Placeholder"/>
<Input label="Filled" defaultValue="Anya Raman"/>
<Input label="Disabled" disabled defaultValue="Kozhikode"/>
<Select label="Disabled select" disabled placeholder="Choose" options={COUNTRIES}/>
</div>
<div className="stack"><p className="cap">Choices</p>
<div>
<Checkbox label="Unchecked"/>
<Checkbox label="Checked" defaultChecked/>
<Checkbox label="Mixed" indeterminate/>
<Checkbox label="Disabled" disabled/>
<Checkbox label="Disabled, checked" disabled defaultChecked/>
</div>
<div>
<Radio name="st" label="Selected" defaultChecked/>
<Radio name="st" label="Not selected"/>
<Radio name="st2" label="Disabled" disabled/>
</div>
</div>
<div className="stack"><p className="cap">Toggles and cards</p>
<div>
<Switch label="Visit reminders" defaultChecked/>
<Switch label="Off"/>
<Switch label="Disabled" disabled/>
</div>
<Radio card name="len" label="7 nights" description="A shorter first stay" defaultChecked/>
<Radio card name="len" label="14 nights" description="Often recommended"/>
</div>
</div>
<p className="shantara-note" style={{marginTop:"var(--space-6)"}}>52px fields, 2px corners, 17px text. Label 8px above, hint or error 8px below. Hover darkens the hairline; focus is Himalaya with a calm 3px brand-soft halo (Clay-soft when invalid). Required is a Himalaya asterisk; optional fields say so in muted text. The tick is an inline SVG and the radio dot a grid child — both centred with place-items:center.</p>
<div className="pair">
<div className="stack" dir="ltr" lang="en">
<p className="shantara-usage-label">LTR</p>
<Input label="Full name" required placeholder="As on your passport"/>
<Select label="Treatment room" placeholder="No preference" options={["Garden pavilion","Cedar suite"]}/>
<Checkbox label="I will upload my medical records" defaultChecked/>
<Switch label="Therapy reminders" labelFirst defaultChecked/>
</div>
<div className="stack shantara-rtl" dir="rtl" lang="ar">
<p className="shantara-usage-label">RTL</p>
<Input label={ar("Full name")} required/>
<Select label={ar("Treatment room")} placeholder={ar("No preference")} options={["Garden pavilion","Cedar suite"].map(ar)}/>
<Checkbox label={ar("I will upload my medical records")} defaultChecked/>
<Switch label={ar("Therapy reminders")} labelFirst defaultChecked/>
</div>
</div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
