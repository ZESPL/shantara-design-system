<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../i18n.js"></script>
<style>body{padding:20px;background:var(--surface-page)}.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-6)}.stack{display:flex;flex-direction:column;gap:var(--space-5)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);margin-top:var(--space-7)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Select, Checkbox, Radio, Switch, Icon } = window.ShantaraDesignSystem_45bbe4;
function Demo(){
  const {t,ar}=window.ShantaraI18n.useLocale();
  const [n,setN]=React.useState("Prefers a quiet room.");
  const rooms=["Garden pavilion","Cedar suite","Water room"];
  return (<div>
<div className="cols">
<div className="stack">
<Input label={t("Full name")} placeholder="Anya Raman" required/>
<Input label={t("Search treatments")} startIcon={<Icon name="search" size={15}/>} placeholder={t("Try “salt”")}/>
<Input label={t("Guests")} defaultValue="8" error={t("Maximum 6 guests per suite.")}/>
</div>
<div className="stack">
<Select label={t("Treatment room")} placeholder={t("No preference")} options={rooms.map(r=>({value:r,label:t(r)}))}/>
<Textarea label={t("Anything we should know?")} maxLength={140} value={n === "Prefers a quiet room." ? t(n) : n} onChange={e=>setN(e.target.value)}/>
</div>
<div className="stack">
<Checkbox label={t("I will upload my medical records")} description={t("Reports from the last 12 months")} defaultChecked/>
<Checkbox label={t("All therapies acknowledged")} indeterminate/>
<Radio name="len" label={t("7 nights")} description={t("a shorter stay")} defaultChecked/>
<Radio name="len" label={t("14 nights")} description={t("often recommended for this programme")}/>
<Switch label={t("Therapy reminders")} labelFirst defaultChecked/>
<Switch label={t("Share progress")}/>
</div>
</div>
<p className="shantara-note" style={{marginTop:"var(--space-6)"}}>Fields: border darkens on hover, Himalaya + a 3px brand-soft halo on focus, 160ms. Errors rise 8px. The checkbox tick and radio dot scale from 0.5 with opacity; the switch knob travels 18px over 240ms. Native select caret drops on focus.</p>
<div className="pair">
<div className="stack" dir="ltr" lang="en">
<p className="shantara-usage-label">LTR</p>
<Input label="Search treatments" startIcon={<Icon name="search" size={15}/>} placeholder="Try “salt”"/>
<Select label="Treatment room" placeholder="No preference" options={rooms}/>
<Checkbox label="I will upload my medical records" description="Reports from the last 12 months" defaultChecked/>
<Switch label="Therapy reminders" labelFirst defaultChecked/>
</div>
<div className="stack shantara-rtl" dir="rtl" lang="ar">
<p className="shantara-usage-label">RTL</p>
<Input label={ar("Search treatments")} startIcon={<Icon name="search" size={15}/>} placeholder={ar("Try “salt”")}/>
<Select label={ar("Treatment room")} placeholder={ar("No preference")} options={rooms.map(ar)}/>
<Checkbox label={ar("I will upload my medical records")} description={ar("Reports from the last 12 months")} defaultChecked/>
<Switch label={ar("Therapy reminders")} labelFirst defaultChecked/>
</div>
</div>
<p className="shantara-note" style={{marginTop:"var(--space-4)"}}>Set <code>dir="rtl"</code> on the field or the page. Search and caret sit at the inline start / end. The switch knob travels toward inline-end. Check and radio stay before the label in reading order.</p>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
