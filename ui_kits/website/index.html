<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Shantara — website kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../i18n.js"></script>
<style>html,body{height:100%}#kit-scroll{height:100vh;overflow-y:auto;background:var(--surface-page)}
/* 1.4.10 Reflow — the kit's grids are inline-styled, so the responsive layer overrides
   them at the two breakpoints where a desktop grid stops fitting. No horizontal scroll
   down to 320px. */
@media (max-width:1000px){
 #root [style*="grid-template-columns: repeat(4"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 #root [style*="grid-template-columns: repeat(3"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
@media (max-width:760px){
 #root [style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important}
 #root [style*="position: sticky"]{position:static!important;top:auto!important}
 #root header nav{flex-wrap:wrap!important;gap:12px!important}
 #root [style*="flex-wrap"]{flex-wrap:wrap!important}
 #root main h1{font-size:clamp(34px,9vw,64px)!important}
 #root main h2{font-size:clamp(26px,6.5vw,44px)!important}
}
@media (max-width:520px){
 #root header > div,#root main > section > div,#root footer > div{padding-left:20px!important;padding-right:20px!important}
 #root [style*="display: flex"]{flex-wrap:wrap}
}</style>
</head><body>
<div id="kit-scroll"><div id="root"></div></div>
<script type="text/babel" src="/ui_kits/website/Photo.js"></script>
<script type="text/babel" src="/ui_kits/website/SiteChrome.js"></script>
<script type="text/babel" src="/ui_kits/website/HomeScreen.js"></script>
<script type="text/babel" src="/ui_kits/website/ConditionsScreen.js"></script>
<script type="text/babel" src="/ui_kits/website/ProgrammeScreen.js"></script>
<script type="text/babel" src="/ui_kits/website/ExperienceScreen.js"></script>
<script type="text/babel" src="/ui_kits/website/AboutScreen.js"></script>
<script type="text/babel" src="/ui_kits/website/JournalScreen.js"></script>
<script type="text/babel" src="/ui_kits/website/ContactScreen.js"></script>
<script type="text/babel" src="/ui_kits/website/ConsultationScreen.js"></script>
<script type="text/babel" src="/ui_kits/website/EnquiryScreen.js"></script>
<script type="text/babel" src="/ui_kits/website/TariffScreen.js"></script>
<script type="text/babel">
function Site(){
  const [view,setView]=React.useState("home");
  const go=(v)=>{setView(v);const s=document.getElementById("kit-scroll");if(s)s.scrollTop=0;};
  const { SiteHeader, SiteFooter, HomeScreen, ConditionsScreen, ProgrammeScreen, ExperienceScreen, AboutScreen, JournalScreen, ContactScreen, ConsultationScreen, TariffScreen } = window;
  const screens={home:<HomeScreen onNavigate={go}/>,conditions:<ConditionsScreen onNavigate={go}/>,programme:<ProgrammeScreen onNavigate={go}/>,experience:<ExperienceScreen onNavigate={go}/>,about:<AboutScreen onNavigate={go}/>,journal:<JournalScreen onNavigate={go}/>,contact:<ContactScreen onNavigate={go}/>,tariffs:<TariffScreen onNavigate={go}/>,booking:<ConsultationScreen onNavigate={go}/>};
  const screen=screens[view]||screens.booking;
  return (<React.Fragment>
    <SiteHeader view={view} onNavigate={go}/>
    {screen}
    <SiteFooter onNavigate={go}/>
  </React.Fragment>);
}
const boot=()=>{ if(window.SiteHeader&&window.HomeScreen&&window.ConsultationScreen&&window.ConditionsScreen&&window.ExperienceScreen&&window.AboutScreen&&window.ContactScreen&&window.TariffScreen&&window.Photo){ReactDOM.createRoot(document.getElementById("root")).render(<Site/>);}else{setTimeout(boot,50);} };
boot();
</script>
</body></html>
