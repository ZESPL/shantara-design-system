<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)">
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:var(--space-7);box-shadow:var(--shadow-sm)">
<span class="shantara-eyebrow">Prescribed therapy</span>
<h4 style="font:var(--type-h4);margin:var(--space-3) 0 var(--space-3)">Mud therapy</h4>
<p style="font:var(--type-body-sm);color:var(--text-secondary);margin:0">45 minutes · daily, 10:30</p>
</div>
<div style="background:var(--surface-raised);border-radius:var(--radius-card);padding:var(--space-7);display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-mono);font-size:var(--text-3xs);color:var(--text-secondary)">
<span>card padding → --space-7 (24)</span><span>eyebrow → title gap → --space-3 (8)</span><span>grid gap → --space-5 (16)</span><span>section rhythm → --section-y (96)</span><span>max width → --layout-max (1240)</span>
</div>
</div></body></html>
