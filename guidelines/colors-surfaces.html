<!-- @dsCard group="Colors" viewport="700x160" name="Semantic surfaces" subtitle="--surface-* aliases: what to reach for instead of a hex" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-body)}</style></head><body><style>.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.c{height:60px;border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;font-size:var(--text-3xs);font-family:var(--font-mono);border:1px solid var(--border-subtle)}</style>
<div class="sw">
<div class="c" style="background:var(--surface-page)">--surface-page</div>
<div class="c" style="background:var(--surface-card)">--surface-card</div>
<div class="c" style="background:var(--surface-raised)">--surface-raised</div>
<div class="c" style="background:var(--surface-sunken)">--surface-sunken</div>
<div class="c" style="background:var(--surface-brand);color:var(--text-on-brand)">--surface-brand</div>
<div class="c" style="background:var(--surface-brand-soft)">--surface-brand-soft</div>
<div class="c" style="background:var(--surface-accent);color:var(--text-on-accent)">--surface-accent</div>
<div class="c" style="background:var(--surface-inverse);color:var(--text-on-inverse)">--surface-inverse</div>
<div class="c" style="background:var(--color-pine-tree)"><span style="background:var(--surface-overlay);color:var(--color-merino);padding:4px 8px;border-radius:4px">--surface-overlay</span></div>
</div></body></html>
