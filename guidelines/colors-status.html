<!-- @dsCard group="Colors" viewport="700x140" name="Status" subtitle="Borrowed from the landscape palette — the brand has no red" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-body)}</style></head><body><style>.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{border-radius:var(--radius-sm);padding:12px;font-size:var(--text-xs);display:flex;flex-direction:column;gap:8px;height:104px;justify-content:center}.d{width:12px;height:12px;border-radius:99px}</style>
<div class="sw">
<div class="c" style="background:var(--status-success-soft)"><span class="d" style="background:var(--status-success)"></span><span style="color:var(--status-success);font-weight:500">Success</span><span style="font-size:var(--text-3xs);color:var(--text-secondary)">Himalaya</span></div>
<div class="c" style="background:var(--status-info-soft)"><span class="d" style="background:var(--status-info)"></span><span style="color:var(--color-pine-tree);font-weight:500">Info</span><span style="font-size:var(--text-3xs);color:var(--color-pine-tree)">Ocean</span></div>
<div class="c" style="background:var(--status-warning-soft)"><span class="d" style="background:var(--status-warning)"></span><span style="color:var(--status-warning);font-weight:500">Warning</span><span style="font-size:var(--text-3xs);color:var(--text-secondary)">Gold</span></div>
<div class="c" style="background:var(--status-danger-soft)"><span class="d" style="background:var(--status-danger)"></span><span style="color:var(--status-danger);font-weight:500">Danger</span><span style="font-size:var(--text-3xs);color:var(--color-pine-tree)">Clay</span></div>
</div></body></html>
