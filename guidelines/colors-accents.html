<!-- @dsCard group="Colors" viewport="700x160" name="Accents" subtitle="Six landscape accents — one per surface, never two together" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-body)}</style></head><body><style>.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.c{height:128px;border-radius:var(--radius-sm);padding:10px;display:flex;flex-direction:column;justify-content:space-between;font-size:var(--text-3xs);color:var(--color-pine-tree)}.n{font-weight:var(--weight-medium)}</style>
<div class="sw">
<div class="c" style="background:var(--color-sand)"><span class="n">Sand</span><span>#EEE4DA</span></div>
<div class="c" style="background:var(--color-ocean)"><span class="n">Ocean</span><span>#A0B1BB</span></div>
<div class="c" style="background:var(--color-clay)"><span class="n">Clay</span><span>#E0A198</span></div>
<div class="c" style="background:var(--color-forest)"><span class="n">Forest</span><span>#B6B9A4</span></div>
<div class="c" style="background:var(--color-sky)"><span class="n">Sky</span><span>#E4C9B6</span></div>
<div class="c" style="background:var(--color-lavender)"><span class="n">Lavender</span><span>#C6C2D1</span></div>
</div></body></html>
