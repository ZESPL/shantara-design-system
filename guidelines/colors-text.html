<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-body)}</style></head><body><style>.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{height:118px;border-radius:var(--radius-sm);padding:12px;font-size:var(--text-xs);display:flex;flex-direction:column;gap:6px;border:1px solid var(--border-subtle)}.s{font-size:var(--text-3xs);font-family:var(--font-mono)}</style>
<div class="sw">
<div class="c" style="background:var(--surface-page)"><span style="color:var(--text-primary)">Primary</span><span style="color:var(--text-secondary)">Secondary</span><span style="color:var(--text-muted)">Muted</span><span class="s" style="color:var(--text-muted)">on Merino</span></div>
<div class="c" style="background:var(--surface-brand)"><span style="color:var(--text-on-brand)">Merino on Himalaya</span><span class="s" style="color:var(--color-gold-crayola)">Gold for emphasis</span></div>
<div class="c" style="background:var(--surface-inverse)"><span style="color:var(--text-on-inverse)">Merino on Pine Tree</span><span class="s" style="color:var(--color-cotton-seed)">Cotton Seed for support</span></div>
<div class="c" style="background:var(--surface-accent)"><span style="color:var(--text-on-accent)">Pine Tree on Gold</span><span class="s" style="color:color-mix(in srgb,var(--color-white) 90%,transparent)">✗ never white on Gold</span></div>
</div></body></html>
