<!-- @dsCard group="Spacing" viewport="700x180" name="Motion" subtitle="Breath-paced: 160 / 240 / 420ms, one ambient 1200ms loop" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-body)}</style></head><body><style>@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}@keyframes breathe{0%,100%{transform:scale(.82);opacity:.45}50%{transform:scale(1);opacity:1}}.dot{width:12px;height:12px;border-radius:99px;background:var(--color-himalaya)}</style>
<div style="display:flex;flex-direction:column;gap:14px;font-family:var(--font-mono);font-size:var(--text-3xs);color:var(--text-secondary)">
<div style="display:flex;align-items:center;gap:14px"><span style="width:150px">--duration-fast 160ms</span><span class="dot" style="animation:drift 1.6s var(--ease-standard) infinite"></span></div>
<div style="display:flex;align-items:center;gap:14px"><span style="width:150px">--duration-base 240ms</span><span class="dot" style="animation:drift 2.4s var(--ease-out) infinite"></span></div>
<div style="display:flex;align-items:center;gap:14px"><span style="width:150px">--duration-slow 420ms</span><span class="dot" style="animation:drift 4.2s var(--ease-out) infinite"></span></div>
<div style="display:flex;align-items:center;gap:14px"><span style="width:150px">--duration-ambient 1200ms</span><span style="display:flex;gap:6px"><span class="dot" style="animation:breathe 1.2s var(--ease-breath) infinite"></span><span class="dot" style="animation:breathe 1.2s var(--ease-breath) .18s infinite"></span><span class="dot" style="animation:breathe 1.2s var(--ease-breath) .36s infinite"></span></span></div>
<div>No bounce, no overshoot. Press = scale(0.98), never a colour flash.</div>
</div></body></html>
